<!doctype html>
<html dir="rtl" lang="ar"><head><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f8faf8;color:#203829;font-family:Tahoma,Arial,sans-serif;line-height:1.9}a{color:inherit;text-decoration:none}.top{background:#315d2d;color:white;text-align:center;padding:7px}.nav{background:white;position:sticky;top:0;z-index:10;box-shadow:0 3px 15px #0001}.wrap{max-width:1200px;margin:auto;padding:0 20px}.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;font-weight:bold}.brand img{height:65px;width:65px;object-fit:contain}.links{display:flex;flex-wrap:wrap;gap:15px;font-size:14px}.links a:hover{color:#4a8b35}.hero{background:linear-gradient(120deg,#e8f2e5,#fff);padding:85px 0}.hero h1{font-size:clamp(30px,5vw,55px);margin:0;color:#305e2c}.hero p{max-width:700px}.btn{display:inline-block;border:0;border-radius:9px;background:#477537;color:white;padding:10px 20px;cursor:pointer;font:inherit}.btn.alt{background:white;color:#477537;border:1px solid #477537}section{padding:55px 0}h2{font-size:28px;color:#315d2d;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px}.card{background:white;border:1px solid #e1e9df;border-radius:16px;padding:23px;box-shadow:0 4px 20px #1232}.card h3{margin-top:0;color:#315d2d}.muted{color:#627468}.stripe{background:#edf3e9}.pill{display:inline-block;padding:5px 12px;background:#e6f1df;border-radius:30px;color:#315d2d;margin:4px}.footer{background:#263e2a;color:white;padding:40px 0}.footer a{text-decoration:underline}input,textarea,select{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #c9d5c5;border-radius:8px;font:inherit}textarea{min-height:100px}.note{font-size:13px;color:#667}.list{padding-right:24px}.list li{margin-bottom:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media(max-width:700px){.split{grid-template-columns:1fr}.nav .wrap{justify-content:ce .utility{display:flex;gap:12px;align-items:center;justify-content:flex-end;max-width:1160px;margin:0 auto;padding:5px 14px}.utility a,.utility button{background:#edf3e9;border:1px solid #d5e3d0;border-radius:8px;color:#305b29;padding:9px 12px;font:inherit;cursor:pointer}.mobile-nav{max-width:1160px;margin:0 auto;padding:10px 14px;background:#fff;box-shadow:0 5px 12px #0001}.mobile-nav[hidden]{display:none}.mobile-nav a{display:inline-block;padding:10px;color:#305b29}.searchbox{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cad9c4;border-radius:10px;font:inherit}.result{padding:15px;border-bottom:1px solid #e4eae1}.result a{font-weight:700;color:#34632b}.small-note{color:#667;line-height:1.8}@media(max-width:750px){.nav .links{display:none}.utility{justify-content:space-between}.mobile-nav a{display:block;border-bottom:1px solid #eee}}
